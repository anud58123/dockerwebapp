---
services:
  devopsdb:
    container_name: cont-1
    image: devopsdb:v1
    ports:
      - '1111:3306'
    volumes:
      - uservol:/var/lib/mysql/
    environments:
      MY_SQL_ROOT_PASSWORD: 'devopspassword'
  my-app:
    container-name: cont-2
    image: myimage:v1
    ports:
      - '1112:8080'
volumes:
  uservol:
